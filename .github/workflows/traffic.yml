name: Update traffic chart

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-chart
  cancel-in-progress: true

jobs:
  update:
    if: ${{ vars.GOATCOUNTER_CODE != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Generate 30-day traffic chart
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: python3 scripts/update_traffic_chart.py

      - name: Commit updated chart
        run: |
          if git diff --quiet -- assets/traffic.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/traffic.svg
          git commit -m "chore: update traffic chart"
          git push
